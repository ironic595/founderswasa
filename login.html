</div>

<script>
// SIMPLE Y A PRUEBA DE TONTOS - sin toggle raro
var WEBHOOK = (window.WASA_WORKER_URL||'https://founderswasablocks.javimsites.workers.dev');

function showNew(){
  document.getElementById('tabNew').classList.add('active');
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('viewNew').style.display='block';
  document.getElementById('viewLogin').style.display='none';
  document.getElementById('mainTitle').innerText='Bienvenido Founder';
}
function showLogin(){
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabNew').classList.remove('active');
  document.getElementById('viewLogin').style.display='block';
  document.getElementById('viewNew').style.display='none';
  document.getElementById('mainTitle').innerText='Ingresar a mi cuenta';
}

document.getElementById('tabNew').addEventListener('click', showNew);
document.getElementById('tabLogin').addEventListener('click', showLogin);

// Si viene ?tab=login en URL, abrir login
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get('tab')==='login') showLogin();
  if(p.get('email')){
    document.getElementById('newEmail').value=p.get('email');
    document.getElementById('loginEmail').value=p.get('email');
  }
})();

function err(id,msg){var el=document.getElementById(id);el.innerText=msg;el.style.display='block';}
function ok(id,msg){var el=document.getElementById(id);el.innerText=msg;el.style.display='block';}
function hide(id){var el=document.getElementById(id);if(el) el.style.display='none';}

document.getElementById('btnReg').addEventListener('click', async function(){
  var email=document.getElementById('newEmail').value.trim().toLowerCase();
  var p1=document.getElementById('newPass').value;
  var p2=document.getElementById('newPass2').value;
  if(!email||email.indexOf('@')===-1){err('newError','Email inválido');return;}
  if(p1.length<6){err('newError','Mín 6 caracteres');return;}
  if(p1!==p2){err('newError','No coinciden');return;}
  hide('newError');
  var btn=this; btn.innerText='Creando...'; btn.disabled=true;
  try{
    var r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'registerreferrer',email:email,password:p1,wallet:''})});
    var j=await r.json();
    if(j.ok){ localStorage.setItem('wasa_token',j.token); localStorage.setItem('wasa_email',email); ok('newOk','✅ Creada REF: '+j.codeId+' - Entrando...'); setTimeout(function(){location.href='/dashboard.html';},1000); }
    else {
      if((j.error||'').indexOf('ya registrado')!==-1){ err('newError','Ya registrado, andá a INGRESAR A MI CUENTA'); showLogin(); document.getElementById('loginEmail').value=email; }
      else err('newError', j.error||'Error');
    }
  }catch(e){err('newError','Error: '+e.message);}
  btn.innerText='CREAR CUENTA UNIFICADA'; btn.disabled=false;
});

document.getElementById('btnLogin').addEventListener('click', async function(){
  var email=document.getElementById('loginEmail').value.trim().toLowerCase();
  var pass=document.getElementById('loginPass').value;
  if(!email||!pass){err('loginError','Falta email/pass');return;}
  hide('loginError');
  try{
    var r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'login',email:email,password:pass})});
    var j=await r.json();
    if(j.ok){ localStorage.setItem('wasa_token',j.token); localStorage.setItem('wasa_email',email); ok('loginOk','Login OK...'); setTimeout(function(){location.href='/dashboard.html';},600); }
    else err('loginError', j.error||'Error');
  }catch(e){err('loginError','Error: '+e.message);}
});
</script>
