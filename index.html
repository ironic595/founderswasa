<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Inversores</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',system-ui;background:#E6F0FF;color:#1E293B;min-height:100vh}.nav{height:64px;background:#1D4ED8;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.nav.logo{color:white;font-weight:800}.wrap{max-width:480px;margin:0 auto;padding:100px 20px 40px}.card{background:#C2D9FF;border:2px solid #93B4FF;border-radius:24px;padding:24px}.title{font-size:22px;font-weight:800;text-align:center}.sub{font-size:12px;opacity:.7;text-align:center;margin-top:8px}.btn{width:100%;height:48px;border-radius:14px;border:0;font-weight:800;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center}.btn-primary{background:#0A101F;color:white}.input{width:100%;height:44px;border-radius:12px;border:1px solid #93B4FF;padding:0 14px;margin-top:10px}.label{font-size:11px;font-weight:700;margin-top:14px;display:block}.tabs{display:flex;gap:8px;margin-top:18px}.tab{flex:1;height:42px;border-radius:12px;border:1px solid #93B4FF;background:#E6F0FF;font-weight:700;cursor:pointer}.tab.active{background:#1D4ED8;color:white}.alert{padding:10px 12px;border-radius:10px;font-size:12px;margin-top:12px;display:none}.alert-error{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626}.hidden{display:none!important}</style>
</head>
<body>
<div class="wrap"><div class="card">
<div style="font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.6;text-align:center;color:#1E3A8A">PANEL DE INVERSORES</div>
<div class="title" id="mainTitle">Bienvenido Founder</div>
<div class="sub" id="mainSub">INGRESA EL CODIGO DE 8 DIGITOS QUE TE ENVIAMOS A TU EMAIL</div>
<div class="tabs"><button class="tab active" id="tabNew" onclick="switchTab('new')">SOY UN NUEVO USUARIO</button><button class="tab" id="tabLogin" onclick="switchTab('login')">INGRESAR A MI CUENTA</button></div>
<div id="viewNew">
  <div id="stepCodeWrapper">
    <label class="label">Email de compra</label><input class="input" id="newEmail" placeholder="tu@email.com">
    <label class="label">INGRESA EL CODIGO DE 8 DIGITOS QUE TE ENVIAMOS A TU EMAIL</label><input class="input" id="newCode" placeholder="C77J8622" style="text-transform:uppercase;letter-spacing:2px;font-weight:800">
    <div class="alert alert-error" id="newError"></div>
    <button class="btn btn-primary" id="btnValidateCode" onclick="validateCode()">Validar codigo</button>
  </div>
  <div id="createPassSection" class="hidden">
    <div class="title" style="font-size:18px;margin-top:12px">Crea tu contraseña</div>
    <div class="sub">Codigo validado para <b id="validatedEmailLabel"></b></div>
    <label class="label">Contraseña (min 8)</label><input class="input" id="newPass" type="password">
    <label class="label">Repetir</label><input class="input" id="newPass2" type="password">
    <div class="alert alert-error" id="passError"></div>
    <button class="btn btn-primary" onclick="registerUser()">Crear cuenta y entrar</button>
    <button class="btn" onclick="backToCode()" style="background:white;border:1px solid #93B4FF">Volver</button>
  </div>
</div>
<div id="viewLogin" class="hidden">
  <label class="label">Email</label><input class="input" id="loginEmail">
  <label class="label">Contraseña</label><input class="input" id="loginPass" type="password">
  <div class="alert alert-error" id="loginError"></div>
  <button class="btn btn-primary" onclick="loginUser()">Ingresar</button>
</div>
</div></div>
<script>
const CONFIG={WEBHOOK_URL:'https://script.google.com/macros/s/AKfycbx2RQsajxrctkhjiKw6pijf_wLV1lr8Cv0h4FU2bI-ROD7sdo9vFdxKSML3NhjWt04gzQ/exec', DASHBOARD:'/dashboard.html'};
let validatedEmail='', validatedCode='';
function switchTab(t){document.getElementById('tabNew').classList.toggle('active',t==='new');document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('viewNew').classList.toggle('hidden',t!=='new');document.getElementById('viewLogin').classList.toggle('hidden',t!=='login');document.getElementById('mainSub').textContent=t==='new'?'INGRESA EL CODIGO DE 8 DIGITOS QUE TE ENVIAMOS A TU EMAIL':'Ingresa con tu email y contraseña';}
(function(){let p=new URLSearchParams(location.search);let e=p.get('email');let c=p.get('code');if(e) document.getElementById('newEmail').value=e;if(c) document.getElementById('newCode').value=c.toUpperCase();if(e&&c) setTimeout(()=>validateCode(),800);})();
function showError(id,msg){let el=document.getElementById(id);el.textContent=msg;el.style.display='block';}
function hideError(id){let el=document.getElementById(id);if(el) el.style.display='none';}
function backToCode(){document.getElementById('stepCodeWrapper').classList.remove('hidden');document.getElementById('createPassSection').classList.add('hidden');}
async function validateCode(){
  let email=document.getElementById('newEmail').value.trim();let code=document.getElementById('newCode').value.trim().toUpperCase();
  if(!email||!code){showError('newError','Completa email y codigo');return;}
  let btn=document.getElementById('btnValidateCode');btn.textContent='Validando...';btn.disabled=true;
  try{
    let r=await fetch(CONFIG.WEBHOOK_URL+'?action=validatePanelCode&email='+encodeURIComponent(email)+'&code='+encodeURIComponent(code));
    let j=await r.json();
    if(j.ok){
      validatedEmail=email;validatedCode=code;
      document.getElementById('stepCodeWrapper').classList.add('hidden');
      document.getElementById('createPassSection').classList.remove('hidden');
      document.getElementById('validatedEmailLabel').textContent=email;
      document.getElementById('mainTitle').textContent='Crea tu contraseña';
    }else{showError('newError',j.error||'Codigo invalido');}
  }catch(e){showError('newError','Error: '+e.message);}
  finally{btn.textContent='Validar codigo';btn.disabled=false;}
}
async function registerUser(){
  let p1=document.getElementById('newPass').value;let p2=document.getElementById('newPass2').value;
  if(p1.length<8||p1!==p2){showError('passError','Revisa contraseñas');return;}
  let res=await fetch(CONFIG.WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register',email:validatedEmail,code:validatedCode,password:p1})});
  let j=await res.json();if(j.ok){localStorage.setItem('wasa_token',j.token);localStorage.setItem('wasa_email',validatedEmail);window.location.href=CONFIG.DASHBOARD;}
}
async function loginUser(){
  let email=document.getElementById('loginEmail').value;let pass=document.getElementById('loginPass').value;
  let res=await fetch(CONFIG.WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',email:email,password:pass})});
  let j=await res.json();if(j.ok){localStorage.setItem('wasa_token',j.token);localStorage.setItem('wasa_email',email);window.location.href=CONFIG.DASHBOARD;}else{showError('loginError',j.error);}
}
</script>
</body>
</html>
