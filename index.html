<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Inversores - wasa.chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',system-ui;background:#E6F0FF;color:#1E293B;min-height:100vh}
.nav{height:64px;background:#1D4ED8;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.nav .logo{color:white;font-weight:800}.nav .links a{color:rgba(255,255,255,.7);text-decoration:none;font-size:11px;font-weight:700;margin-left:16px}
.wrap{max-width:480px;margin:0 auto;padding:100px 20px 40px}
.card{background:#C2D9FF;border:2px solid #93B4FF;border-radius:24px;padding:24px;box-shadow:0 12px 32px rgba(29,78,216,.12)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.6;color:#1E3A8A;text-transform:uppercase;text-align:center}
.title{font-size:22px;font-weight:800;margin-top:6px;text-align:center}
.sub{font-size:12px;opacity:.7;margin-top:8px;text-align:center;line-height:1.4}
.btn{width:100%;height:48px;border-radius:14px;border:0;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.btn-primary{background:#0A101F;color:white;border:1px solid #3B82F6}
.btn-secondary{background:white;color:#1E293B;border:1px solid #93B4FF}
.input{width:100%;height:44px;border-radius:12px;border:1px solid #93B4FF;padding:0 14px;margin-top:10px;font-size:14px}
.label{font-size:11px;font-weight:700;margin-top:14px;display:block;opacity:.7}
.tabs{display:flex;gap:8px;margin-top:18px}
.tab{flex:1;height:42px;border-radius:12px;border:1px solid #93B4FF;background:#E6F0FF;font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:#1D4ED8;color:white;border-color:#1D4ED8}
.divider{height:1px;background:#93B4FF;margin:18px 0;opacity:.5}
.alert{padding:10px 12px;border-radius:10px;font-size:12px;margin-top:12px;display:none}
.alert-error{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626}
.alert-success{background:#F0FDF4;border:1px solid #BBF7D0;color:#16A34A}
.hidden{display:none!important}
</style>
</head>
<body>
<nav class="nav"><div class="logo">wasa.chat<span style="color:#D4AF37;">/founders</span> / panel</div><div class="links"><a href="/founders.html">COMPRAR</a><a href="/info.html">INFO</a></div></nav>
<div class="wrap">
  <div class="card">
    <div class="eyebrow">PANEL DE INVERSORES</div>
    <div class="title">Bienvenido Founder</div>
    <div class="sub">Accede con tu email de compra</div>
    <div class="tabs"><button class="tab active" id="tabNew" onclick="switchTab('new')">SOY UN NUEVO USUARIO</button><button class="tab" id="tabLogin" onclick="switchTab('login')">INGRESAR A MI CUENTA</button></div>
    <div id="viewNew">
      <label class="label">Email de compra</label><input class="input" id="newEmail" placeholder="tu@email.com">
      <label class="label">Codigo 30 min</label><input class="input" id="newCode" placeholder="A7F9K2P1" style="text-transform:uppercase;letter-spacing:2px;font-weight:800">
      <div class="alert alert-error" id="newError"></div><div class="alert alert-success" id="newSuccess"></div>
      <button class="btn btn-primary" id="btnValidateCode" onclick="validateCode()">Validar codigo</button>
      <div id="createPassSection" class="hidden"><div class="divider"></div><div class="title" style="font-size:16px">Crea tu contrasena</div>
        <label class="label">Contrasena (min 8)</label><input class="input" id="newPass" type="password" placeholder="••••••••">
        <label class="label">Repetir</label><input class="input" id="newPass2" type="password" placeholder="••••••••">
        <button class="btn btn-primary" onclick="registerUser()">Crear cuenta</button></div>
    </div>
    <div id="viewLogin" class="hidden">
      <label class="label">Email</label><input class="input" id="loginEmail" placeholder="tu@email.com">
      <label class="label">Contrasena</label><input class="input" id="loginPass" type="password" placeholder="••••••••">
      <div class="alert alert-error" id="loginError"></div>
      <button class="btn btn-primary" onclick="loginUser()">Ingresar</button>
    </div>
  </div>
</div>
<script>
const CONFIG={WEBHOOK_URL:'https://script.google.com/macros/s/AKfycbyCzKxGfe8U5Ip0ETO86rqx4K6e4S5MeYer4oebBkAFN3zqYMVphSVrnBMW1q_h9cgvBw/exec', DASHBOARD:'/panel/dashboard.html'};
let validatedEmail='', validatedCode='';
function switchTab(t){ document.getElementById('tabNew').classList.toggle('active', t==='new'); document.getElementById('tabLogin').classList.toggle('active', t==='login'); document.getElementById('viewNew').classList.toggle('hidden', t!=='new'); document.getElementById('viewLogin').classList.toggle('hidden', t!=='login'); }
(function(){ let p=new URLSearchParams(location.search); let e=p.get('email'); let c=p.get('code'); if(e){document.getElementById('newEmail').value=e;document.getElementById('loginEmail').value=e;} if(c){document.getElementById('newCode').value=c.toUpperCase();} })();
function showError(id,msg){let el=document.getElementById(id);el.textContent=msg;el.style.display='block';}
function hideError(id){document.getElementById(id).style.display='none';}
async function validateCode(){ let email=document.getElementById('newEmail').value.trim(); let code=document.getElementById('newCode').value.trim().toUpperCase(); if(!email||!code){showError('newError','Completa email y codigo');return;} hideError('newError'); let btn=document.getElementById('btnValidateCode');btn.textContent='Validando...';btn.disabled=true; try{ let r=await fetch(CONFIG.WEBHOOK_URL+'?action=validatePanelCode&email='+encodeURIComponent(email)+'&code='+encodeURIComponent(code)); let j=await r.json(); if(j.ok){ validatedEmail=email;validatedCode=code; document.getElementById('newSuccess').textContent='Codigo valido - Crea tu contrasena'; document.getElementById('newSuccess').style.display='block'; document.getElementById('createPassSection').classList.remove('hidden'); } else{ showError('newError', j.error||'Codigo invalido'); } }catch(e){showError('newError','Error: '+e.message);} finally{btn.textContent='Validar codigo';btn.disabled=false;} }
async function registerUser(){ let p1=document.getElementById('newPass').value; let p2=document.getElementById('newPass2').value; if(p1.length<8){showError('newError','Min 8');return;} if(p1!==p2){showError('newError','No coinciden');return;} hideError('newError'); try{ let res=await fetch(CONFIG.WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'register', email:validatedEmail, code:validatedCode, password:p1})}); let j=await res.json(); if(j.ok){ localStorage.setItem('wasa_token', j.token); localStorage.setItem('wasa_email', validatedEmail); window.location.href=CONFIG.DASHBOARD; } else{ showError('newError', j.error); } }catch(e){showError('newError','Error: '+e.message);} }
async function loginUser(){ let email=document.getElementById('loginEmail').value.trim(); let pass=document.getElementById('loginPass').value; if(!email||!pass){showError('loginError','Completa datos');return;} hideError('loginError'); try{ let res=await fetch(CONFIG.WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login', email:email, password:pass})}); let j=await res.json(); if(j.ok){ localStorage.setItem('wasa_token', j.token); localStorage.setItem('wasa_email', email); window.location.href=CONFIG.DASHBOARD; } else{ showError('loginError', j.error); } }catch(e){showError('loginError','Error: '+e.message);} }
</script>
</body>
</html>
